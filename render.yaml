# Render Blueprint – one-click deploy for Synqed
# https://render.com/docs/blueprint-spec

databases:
  - name: synqed-db
    databaseName: schedule_bot
    user: schedule_bot_user

services:
  # Backend: Discord Bot + Express API
  - type: web
    name: synqed-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: synqed-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        sync: false
      - key: NODE_ENV
        value: production

  # Dashboard: Next.js frontend
  - type: web
    name: synqed-dashboard
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    envVars:
      - key: BOT_API_URL
        sync: false
      - key: NEXT_PUBLIC_BOT_API_URL
        sync: false
      - key: NODE_ENV
        value: production
